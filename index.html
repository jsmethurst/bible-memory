<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bible Memory</title>
  <meta name="viewport" content="width=414, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#f4efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Memory">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before first paint.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('bm.settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'vellum';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'vellum'; }
    })();
  </script>
</head>
<body>
  <div id="app">
    <div id="view"><main class="boot"><div class="boot-dot"></div></main></div>
    <nav id="tabbar" hidden></nav>
  </div>
  <input id="keytrap" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="Typing input">
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
